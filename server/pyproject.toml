[project]
name = "isabelle"
version = "0.1.0"
description = "Isabelle reminder server: anonymous push subscriptions and a morning reminder job"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "pywebpush>=2.0",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
